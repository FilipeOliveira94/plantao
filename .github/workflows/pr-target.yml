name: PR target

# Every PR merges into main. A PR stacked on another PR's branch fails this
# check until it is retargeted to main; with automatic branch deletion on,
# GitHub retargets it when the base PR merges. See plantao#88, which merged
# into a branch that had already merged, so its changes never reached main.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  target:
    name: targets main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "::error::This PR targets '$BASE', not main. Retarget it to main before merging; a stacked PR is retargeted automatically when '$BASE' merges."
            exit 1
          fi
          echo "Targets main."
